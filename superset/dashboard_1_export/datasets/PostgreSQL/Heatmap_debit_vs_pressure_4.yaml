sql: "SELECT \n    -- \u041E\u043A\u0440\u0443\u0433\u043B\u044F\u0435\u043C \u0434\
  \u0435\u0431\u0438\u0442 \u0434\u043E \u0448\u0430\u0433\u0430 \u0432 10 \u0442\u043E\
  \u043D\u043D (\u043F\u043E\u043B\u0443\u0447\u0438\u043C \u0434\u0438\u0430\u043F\
  \u0430\u0437\u043E\u043D\u044B: 0, 10, 20, 30...)\n    FLOOR(oil_ton / 5) * 5 AS\
  \ debit_range,\n    \n    -- \u041E\u043A\u0440\u0443\u0433\u043B\u044F\u0435\u043C\
  \ \u0434\u0430\u0432\u043B\u0435\u043D\u0438\u0435 \u0434\u043E \u0448\u0430\u0433\
  \u0430 \u0432 5 \u0430\u0442\u043C\u043E\u0441\u0444\u0435\u0440 (\u043F\u043E\u043B\
  \u0443\u0447\u0438\u043C \u0434\u0438\u0430\u043F\u0430\u0437\u043E\u043D\u044B\
  : 50, 55, 60...)\n    FLOOR(pressure / 5) * 5 AS pressure_range,\n    \n    -- \u041C\
  \u0435\u0442\u0440\u0438\u043A\u0430: \u0441\u0447\u0438\u0442\u0430\u0435\u043C\
  , \u0441\u043A\u043E\u043B\u044C\u043A\u043E \u0440\u0430\u0437 \u0441\u043A\u0432\
  \u0430\u0436\u0438\u043D\u044B \u043F\u043E\u043F\u0430\u0434\u0430\u043B\u0438\
  \ \u0432 \u044D\u0442\u043E \u0441\u043E\u0441\u0442\u043E\u044F\u043D\u0438\u0435\
  \n    \n    -- \u0410\u043B\u044C\u0442\u0435\u0440\u043D\u0430\u0442\u0438\u0432\
  \u043D\u0430\u044F \u043C\u0435\u0442\u0440\u0438\u043A\u0430: \u0441\u0440\u0435\
  \u0434\u043D\u044F\u044F \u0434\u043E\u0431\u044B\u0447\u0430 \u0432 \u044D\u0442\
  \u0438\u0445 \u0443\u0441\u043B\u043E\u0432\u0438\u044F\u0445\n    AVG(oil_ton)\
  \ AS avg_debit\nFROM production\nWHERE pressure IS NOT NULL\nGROUP BY 1, 2;\n"
